services:
  postgres:
    image: postgres:16
    container_name: evalai-postgres
    environment:
      POSTGRES_DB: evalai
      POSTGRES_USER: evalai_user
      POSTGRES_PASSWORD: change_me_locally
    ports:
      - "5432:5432"
    volumes:
      - evalai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalai_user -d evalai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  evalai-postgres-data:
